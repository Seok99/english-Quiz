<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>전체 단어 - 영어단어 퀴즈</title>
  <meta name="theme-color" content="#ffffff">

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f7f7f7;
    }
    .container {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    button, select {
      font-size: 18px;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #aaa;
      box-sizing: border-box;
      cursor: pointer;
    }
    button {
      background: #4a8fff;
      color: white;
      font-weight: bold;
      border: none;
    }
    button:hover {
      background: #3a7fee;
    }
    .nav-menu {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .nav-btn {
      flex: 1;
      min-width: 120px;
      padding: 12px;
      background: #e8f4f8;
      color: #333;
      border: 2px solid #4a8fff;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      text-decoration: none;
      text-align: center;
      transition: all 0.3s;
      display: block;
    }
    .nav-btn:hover {
      background: #4a8fff;
      color: white;
    }
    .nav-btn.active {
      background: #4a8fff;
      color: white;
    }
    .controls {
      display: flex;
      gap: 10px;
      margin: 20px 0;
      flex-wrap: wrap;
    }
    .controls button, .controls select {
      flex: 1;
      min-width: 150px;
    }
    .total-count {
      font-size: 18px;
      color: #666;
      margin: 10px 0;
    }
    #speedControl, #languageControl {
      width: auto;
      min-width: 150px;
    }
    .controls-fixed {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      z-index: 1000;
      display: none;
      gap: 10px;
    }
    .controls-fixed button {
      margin: 0;
      flex: 1;
      min-width: 100px;
    }
    
    /* 알파벳 그리드 */
    .alphabet-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
      gap: 10px;
      margin: 20px 0;
    }
    .alphabet-btn {
      padding: 15px 10px;
      background: #e8f4f8;
      border: 2px solid #4a8fff;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      transition: all 0.3s;
      font-size: 16px;
      font-weight: bold;
      color: #333;
    }
    .alphabet-btn:hover {
      background: #d0e8f8;
      transform: translateY(-2px);
    }
    .alphabet-btn.active {
      background: #4a8fff;
      color: white;
    }
    .alphabet-letter {
      font-size: 24px;
      display: block;
    }
    .alphabet-count {
      font-size: 12px;
      color: #666;
      margin-top: 3px;
    }
    .alphabet-btn.active .alphabet-count {
      color: #fff;
    }
    
    /* 단어 목록 */
    .word-list {
      margin-top: 20px;
      max-height: 600px;
      overflow-y: auto;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      background: white;
    }
    .word-list::-webkit-scrollbar {
      width: 10px;
    }
    .word-list::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 8px;
    }
    .word-list::-webkit-scrollbar-thumb {
      background: #4a8fff;
      border-radius: 8px;
    }
    .word-list::-webkit-scrollbar-thumb:hover {
      background: #3a7fee;
    }
    .word-item {
      padding: 15px 20px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
    }
    .word-item:first-child {
      border-top-left-radius: 6px;
      border-top-right-radius: 6px;
    }
    .word-item:last-child {
      border-bottom: none;
      border-bottom-left-radius: 6px;
      border-bottom-right-radius: 6px;
    }
    .word-item:hover {
      background: #f0f8ff;
    }
    .word-item.playing {
      background: #fffacd !important;
    }
    .word-info {
      flex: 1;
    }
    .word-number {
      color: #999;
      font-size: 14px;
      margin-bottom: 3px;
    }
    .word-name {
      font-weight: bold;
      color: #2c5aa0;
      font-size: 18px;
      margin-bottom: 5px;
    }
    .word-meaning {
      color: #666;
      font-size: 14px;
    }
    .word-meaning.hidden {
      display: none;
    }
    .word-name.clickable {
      cursor: pointer;
      text-decoration: underline;
      text-decoration-style: dotted;
    }
    .word-name.clickable:hover {
      color: #1a4d8f;
    }
    .word-actions {
      display: flex;
      gap: 5px;
    }
    .speak-btn {
      background: #28a745;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }
    .speak-btn:hover {
      background: #218838;
    }
    .bookmark-btn {
      background: #ffc107;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }
    .bookmark-btn:hover {
      background: #e0a800;
    }
    .bookmark-btn.active {
      background: #ff9800;
    }
    .current-filter {
      font-size: 16px;
      color: #4a8fff;
      font-weight: bold;
      margin: 15px 0;
      padding: 10px;
      background: #f0f8ff;
      border-radius: 5px;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>📚 전체 단어 목록</h2>

  <!-- 네비게이션 메뉴 -->
  <div class="nav-menu">
    <a href="wordlist.html" class="nav-btn active">📚 전체 단어</a>
    <a href="bookmarks.html" class="nav-btn">⭐ 즐겨찾기</a>
    <a href="index.html" class="nav-btn">🎯 퀴즈</a>
  </div>

  <div class="total-count" id="totalCount">불러오는 중...</div>

  <!-- 컨트롤 버튼 -->
  <div class="controls">
    <button onclick="playAll()" id="playBtn">▶️ 순차 재생 시작</button>
    <button onclick="pausePlay()" id="pauseBtn" style="background: #ffc107; display: none;">⏸️ 일시정지</button>
    <button onclick="resumePlay()" id="resumeBtn" style="background: #28a745; display: none;">▶️ 재개</button>
    <button onclick="stopPlay()" id="stopBtn" style="background: #dc3545; display: none;">⏹️ 중지</button>
    <select id="speedControl" onchange="changeSpeed()">
      <option value="0.6">느리게 (0.6x)</option>
      <option value="0.8" selected>보통 (0.8x)</option>
      <option value="1.0">빠르게 (1.0x)</option>
    </select>
    <select id="languageControl" onchange="changeLanguage()">
      <option value="en">영어만</option>
      <option value="both">영어+한글</option>
    </select>
  </div>

  <div class="controls" style="margin-top: 10px;">
    <button onclick="clearFilter()" id="clearBtn" style="display: none;">🔄 목록 닫기</button>
    <button onclick="toggleMeaningDisplay()" id="toggleMeaningBtn">👁️ 뜻 숨기기</button>
  </div>

  <!-- 알파벳 그리드 -->
  <div class="alphabet-grid" id="alphabetGrid"></div>

  <!-- 현재 필터 표시 -->
  <div class="current-filter" id="currentFilter" style="display: none;"></div>

  <!-- 단어 목록 -->
  <div class="word-list" id="wordList"></div>
</div>

<!-- 재생 중 고정 컨트롤 -->
<div class="controls-fixed" id="fixedControls">
  <button onclick="pausePlay()" id="fixedPauseBtn" style="background: #ffc107;">⏸️ 일시정지</button>
  <button onclick="resumePlay()" id="fixedResumeBtn" style="background: #28a745; display: none;">▶️ 재개</button>
  <button onclick="stopPlay()" style="background: #dc3545;">⏹️ 중지</button>
</div>

<script>
let WORDS = [];
let bookmarkedWords = new Set();
let isPlaying = false;
let isPaused = false;
let currentPlayIndex = 0;
let speechRate = 0.8;
let playMode = 'en';
let meaningHidden = false;
let currentFilter = null; // 현재 선택된 알파벳
let groupedWords = {}; // 알파벳별 그룹화된 단어
let currentDisplayWords = []; // 현재 표시 중인 단어들

// -----------------------------
// 데이터 불러오기
// -----------------------------
async function loadData() {
  try {
    const response = await fetch('words.json');
    if (!response.ok) throw new Error('words.json 파일을 찾을 수 없습니다.');
    WORDS = await response.json();
    
    const saved = localStorage.getItem('bookmarkedWords');
    if (saved) {
      bookmarkedWords = new Set(JSON.parse(saved));
    }
    
    // 알파벳별로 그룹화
    WORDS.forEach((item, index) => {
      item.originalIndex = index;
      const firstLetter = item.word.charAt(0).toUpperCase();
      if (!groupedWords[firstLetter]) {
        groupedWords[firstLetter] = [];
      }
      groupedWords[firstLetter].push(item);
    });
    
    renderAlphabetGrid();
    clearFilter(); // 초기에는 단어 목록 비우기
    
    document.getElementById('totalCount').textContent = `총 ${WORDS.length}개의 단어`;
  } catch (error) {
    alert('데이터를 불러오는데 실패했습니다: ' + error.message);
    console.error('Error:', error);
  }
}

// -----------------------------
// 알파벳 그리드 렌더링
// -----------------------------
function renderAlphabetGrid() {
  const sortedLetters = Object.keys(groupedWords).sort();
  let html = '';
  
  sortedLetters.forEach(letter => {
    const count = groupedWords[letter].length;
    html += `
      <div class="alphabet-btn" onclick="filterByAlphabet('${letter}')">
        <span class="alphabet-letter">${letter}</span>
        <span class="alphabet-count">${count}개</span>
      </div>
    `;
  });
  
  document.getElementById('alphabetGrid').innerHTML = html;
}

// -----------------------------
// 알파벳 필터
// -----------------------------
function filterByAlphabet(letter) {
  // 같은 알파벳을 다시 클릭하면 목록 닫기
  if (currentFilter === letter) {
    clearFilter();
    return;
  }
  
  currentFilter = letter;
  currentDisplayWords = groupedWords[letter] || [];
  
  // 알파벳 버튼 활성화 상태 변경
  document.querySelectorAll('.alphabet-btn').forEach(btn => {
    btn.classList.remove('active');
  });
  event.target.closest('.alphabet-btn').classList.add('active');
  
  // 필터 표시
  document.getElementById('currentFilter').style.display = 'block';
  document.getElementById('currentFilter').textContent = `${letter}로 시작하는 단어 (${currentDisplayWords.length}개)`;
  
  // 목록 닫기 버튼 표시
  document.getElementById('clearBtn').style.display = 'block';
  
  renderWordList();
}

// -----------------------------
// 필터 초기화 (목록 닫기)
// -----------------------------
function clearFilter() {
  currentFilter = null;
  currentDisplayWords = [];
  
  // 알파벳 버튼 활성화 해제
  document.querySelectorAll('.alphabet-btn').forEach(btn => {
    btn.classList.remove('active');
  });
  
  // 필터 표시 숨기기
  document.getElementById('currentFilter').style.display = 'none';
  
  // 목록 닫기 버튼 숨기기
  document.getElementById('clearBtn').style.display = 'none';
  
  renderWordList();
}

// -----------------------------
// 단어 목록 렌더링
// -----------------------------
function renderWordList() {
  let html = '';
  
  if (currentDisplayWords.length === 0) {
    // 단어가 없을 때 안내 메시지
    html = '<p style="text-align: center; color: #999; padding: 40px;">알파벳을 선택하여 단어를 확인하세요</p>';
  } else {
    currentDisplayWords.forEach(word => {
      const isBookmarked = bookmarkedWords.has(word.word);
      const bookmarkClass = isBookmarked ? 'active' : '';
      const bookmarkText = isBookmarked ? '⭐' : '☆';
      const meaningClass = meaningHidden ? 'hidden' : '';
      const wordNameClass = meaningHidden ? 'clickable' : '';
      
      html += `
        <div class="word-item" id="word-${word.originalIndex}">
          <div class="word-info">
            <div class="word-number">#${word.originalIndex + 1}</div>
            <div class="word-name ${wordNameClass}" ${meaningHidden ? `onclick="toggleIndividualMeaning(${word.originalIndex})"` : ''}>${word.word}</div>
            <div class="word-meaning ${meaningClass}" id="meaning-${word.originalIndex}">${word.meaning.join(', ')}</div>
          </div>
          <div class="word-actions">
            <button class="speak-btn" onclick="speakWord('${word.word}')">🔊</button>
            <button class="bookmark-btn ${bookmarkClass}" onclick="toggleBookmark('${word.word}', ${word.originalIndex})">
              ${bookmarkText}
            </button>
          </div>
        </div>
      `;
    });
  }
  
  document.getElementById('wordList').innerHTML = html;
}

// -----------------------------
// 단어 발음
// -----------------------------
function speakWord(word) {
  const utterance = new SpeechSynthesisUtterance(word);
  utterance.lang = 'en-US';
  utterance.rate = speechRate;
  
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utterance);
}

// -----------------------------
// 순차 재생
// -----------------------------
function playAll() {
  if (currentDisplayWords.length === 0) {
    alert('단어가 없습니다.');
    return;
  }
  
  isPlaying = true;
  isPaused = false;
  currentPlayIndex = 0;
  
  document.getElementById('playBtn').style.display = 'none';
  document.getElementById('pauseBtn').style.display = 'block';
  document.getElementById('resumeBtn').style.display = 'none';
  document.getElementById('stopBtn').style.display = 'block';
  document.getElementById('fixedControls').style.display = 'flex';
  document.getElementById('fixedPauseBtn').style.display = 'block';
  document.getElementById('fixedResumeBtn').style.display = 'none';
  
  playNext();
}

function playNext() {
  if (!isPlaying || isPaused) {
    return;
  }
  
  if (currentPlayIndex >= currentDisplayWords.length) {
    stopPlay();
    return;
  }
  
  const currentWord = currentDisplayWords[currentPlayIndex];
  const word = currentWord.word;
  const meaning = currentWord.meaning.join(', ');
  const wordEl = document.getElementById(`word-${currentWord.originalIndex}`);
  
  // 이전 하이라이트 제거
  document.querySelectorAll('.word-item').forEach(el => {
    el.classList.remove('playing');
  });
  
  // 현재 하이라이트
  if (wordEl) {
    wordEl.classList.add('playing');
    wordEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  
  // 발음
  if (playMode === 'en') {
    speakText(word, 'en-US', () => {
      if (isPlaying && !isPaused) {
        currentPlayIndex++;
        setTimeout(playNext, 500);
      }
    });
  } else {
    speakText(word, 'en-US', () => {
      if (isPlaying && !isPaused) {
        setTimeout(() => {
          speakText(meaning, 'ko-KR', () => {
            if (isPlaying && !isPaused) {
              currentPlayIndex++;
              setTimeout(playNext, 500);
            }
          });
        }, 300);
      }
    });
  }
}

function speakText(text, lang, callback) {
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = lang;
  utterance.rate = speechRate;
  
  if (callback) {
    utterance.onend = callback;
  }
  
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utterance);
}

function pausePlay() {
  isPaused = true;
  window.speechSynthesis.cancel();
  
  document.getElementById('pauseBtn').style.display = 'none';
  document.getElementById('resumeBtn').style.display = 'block';
  document.getElementById('fixedPauseBtn').style.display = 'none';
  document.getElementById('fixedResumeBtn').style.display = 'block';
}

function resumePlay() {
  isPaused = false;
  
  document.getElementById('pauseBtn').style.display = 'block';
  document.getElementById('resumeBtn').style.display = 'none';
  document.getElementById('fixedPauseBtn').style.display = 'block';
  document.getElementById('fixedResumeBtn').style.display = 'none';
  
  playNext();
}

function stopPlay() {
  isPlaying = false;
  isPaused = false;
  window.speechSynthesis.cancel();
  
  document.getElementById('playBtn').style.display = 'block';
  document.getElementById('pauseBtn').style.display = 'none';
  document.getElementById('resumeBtn').style.display = 'none';
  document.getElementById('stopBtn').style.display = 'none';
  document.getElementById('fixedControls').style.display = 'none';
  
  document.querySelectorAll('.word-item').forEach(el => {
    el.classList.remove('playing');
  });
}

// -----------------------------
// 속도/언어 변경
// -----------------------------
function changeSpeed() {
  speechRate = parseFloat(document.getElementById('speedControl').value);
}

function changeLanguage() {
  playMode = document.getElementById('languageControl').value;
}

// -----------------------------
// 즐겨찾기 토글
// -----------------------------
function toggleBookmark(word, index) {
  if (bookmarkedWords.has(word)) {
    bookmarkedWords.delete(word);
  } else {
    bookmarkedWords.add(word);
  }
  
  localStorage.setItem('bookmarkedWords', JSON.stringify([...bookmarkedWords]));
  
  const btn = document.querySelector(`#word-${index} .bookmark-btn`);
  if (bookmarkedWords.has(word)) {
    btn.classList.add('active');
    btn.textContent = '⭐';
  } else {
    btn.classList.remove('active');
    btn.textContent = '☆';
  }
}

// -----------------------------
// 뜻 표시 토글
// -----------------------------
function toggleMeaningDisplay() {
  meaningHidden = !meaningHidden;
  const btn = document.getElementById('toggleMeaningBtn');
  
  if (meaningHidden) {
    btn.textContent = '👁️ 뜻 보이기';
  } else {
    btn.textContent = '👁️ 뜻 숨기기';
  }
  
  renderWordList();
}

// -----------------------------
// 개별 단어 뜻 토글
// -----------------------------
function toggleIndividualMeaning(index) {
  const meaningEl = document.getElementById(`meaning-${index}`);
  if (meaningEl) {
    meaningEl.classList.toggle('hidden');
  }
}

// 페이지 로드 시 데이터 불러오기
loadData();
</script>
</body>
</html>
