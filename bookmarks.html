<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>즐겨찾기 - 영어단어 퀴즈</title>
  <meta name="theme-color" content="#ffffff">

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f7f7f7;
    }
    .container {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    button, select {
      font-size: 18px;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #aaa;
      box-sizing: border-box;
      cursor: pointer;
    }
    button {
      background: #4a8fff;
      color: white;
      font-weight: bold;
      border: none;
    }
    button:hover {
      background: #3a7fee;
    }
    .nav-menu {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .nav-btn {
      flex: 1;
      min-width: 120px;
      padding: 12px;
      background: #e8f4f8;
      color: #333;
      border: 2px solid #4a8fff;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      text-decoration: none;
      text-align: center;
      transition: all 0.3s;
      display: block;
    }
    .nav-btn:hover {
      background: #4a8fff;
      color: white;
    }
    .nav-btn.active {
      background: #4a8fff;
      color: white;
    }
    .controls {
      display: flex;
      gap: 10px;
      margin: 20px 0;
      flex-wrap: wrap;
    }
    .controls button {
      flex: 1;
      min-width: 150px;
    }
    .total-count {
      font-size: 18px;
      color: #666;
      margin: 10px 0;
    }
    .empty-message {
      text-align: center;
      padding: 60px 20px;
      color: #999;
      font-size: 18px;
    }
    .empty-message button {
      margin-top: 20px;
      width: auto;
      padding: 12px 30px;
    }
    .clear-all-btn {
      background: #dc3545;
    }
    .clear-all-btn:hover {
      background: #c82333;
    }
    
    /* 알파벳 그리드 */
    .alphabet-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
      gap: 10px;
      margin: 20px 0;
    }
    .alphabet-btn {
      padding: 15px 10px;
      background: #fff8e1;
      border: 2px solid #ff9800;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      transition: all 0.3s;
      font-size: 16px;
      font-weight: bold;
      color: #333;
    }
    .alphabet-btn:hover {
      background: #ffe0b2;
      transform: translateY(-2px);
    }
    .alphabet-btn.active {
      background: #ff9800;
      color: white;
    }
    .alphabet-letter {
      font-size: 24px;
      display: block;
    }
    .alphabet-count {
      font-size: 12px;
      color: #666;
      margin-top: 3px;
    }
    .alphabet-btn.active .alphabet-count {
      color: #fff;
    }
    
    /* 단어 목록 */
    .word-list {
      margin-top: 20px;
      max-height: 600px;
      overflow-y: auto;
      border: 2px solid #ff9800;
      border-radius: 8px;
      background: white;
    }
    .word-list::-webkit-scrollbar {
      width: 10px;
    }
    .word-list::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 8px;
    }
    .word-list::-webkit-scrollbar-thumb {
      background: #ff9800;
      border-radius: 8px;
    }
    .word-list::-webkit-scrollbar-thumb:hover {
      background: #f57c00;
    }
    .word-item {
      padding: 15px 20px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
    }
    .word-item:last-child {
      border-bottom: none;
    }
    .word-item:hover {
      background: #fff8e1;
    }
    .word-info {
      flex: 1;
    }
    .word-name {
      font-weight: bold;
      color: #e65100;
      font-size: 18px;
      margin-bottom: 5px;
      cursor: pointer;
      text-decoration: underline;
      text-decoration-style: dotted;
    }
    .word-name:hover {
      color: #bf360c;
    }
    .word-meaning {
      color: #666;
      font-size: 14px;
      display: none;
      margin-top: 5px;
    }
    .word-meaning.show {
      display: block;
    }
    .word-actions {
      display: flex;
      gap: 5px;
    }
    .speak-btn {
      background: #28a745;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }
    .speak-btn:hover {
      background: #218838;
    }
    .remove-btn {
      background: #dc3545;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }
    .remove-btn:hover {
      background: #c82333;
    }
    .current-filter {
      font-size: 16px;
      color: #ff9800;
      font-weight: bold;
      margin: 15px 0;
      padding: 10px;
      background: #fff8e1;
      border-radius: 5px;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>⭐ 즐겨찾기 단어</h2>

  <!-- 네비게이션 메뉴 -->
  <div class="nav-menu">
    <a href="wordlist.html" class="nav-btn">📚 전체 단어</a>
    <a href="bookmarks.html" class="nav-btn active">⭐ 즐겨찾기</a>
    <a href="index.html" class="nav-btn">🎯 퀴즈</a>
  </div>

  <div class="total-count" id="totalCount">불러오는 중...</div>

  <!-- 컨트롤 버튼 -->
  <div class="controls" id="controlsArea" style="display:none;">
    <button onclick="clearFilter()" id="clearBtn" style="display: none;">🔄 목록 닫기</button>
    <button onclick="clearAllBookmarks()" class="clear-all-btn">🗑️ 전체 삭제</button>
  </div>

  <!-- 알파벳 그리드 -->
  <div class="alphabet-grid" id="alphabetGrid"></div>

  <!-- 현재 필터 표시 -->
  <div class="current-filter" id="currentFilter" style="display: none;"></div>

  <!-- 단어 목록 -->
  <div class="word-list" id="wordList"></div>

  <!-- 빈 메시지 -->
  <div class="empty-message" id="emptyMessage" style="display:none;">
    <div>⭐ 즐겨찾기한 단어가 없습니다.</div>
    <div style="margin-top: 10px; color: #bbb;">퀴즈나 전체 단어 페이지에서 단어를 즐겨찾기에 추가해보세요!</div>
    <button onclick="location.href='wordlist.html'">📚 전체 단어 보러가기</button>
  </div>
</div>

<script>
let WORDS = [];
let bookmarkedWords = new Set();
let bookmarkedWordsList = [];
let groupedWords = {};
let currentFilter = null;
let currentDisplayWords = [];

// -----------------------------
// 데이터 불러오기
// -----------------------------
async function loadData() {
  try {
    // 단어 불러오기
    const response = await fetch('words.json');
    if (!response.ok) throw new Error('words.json 파일을 찾을 수 없습니다.');
    WORDS = await response.json();
    
    // 즐겨찾기 불러오기
    const saved = localStorage.getItem('bookmarkedWords');
    if (saved) {
      bookmarkedWords = new Set(JSON.parse(saved));
    }
    
    // 즐겨찾기된 단어만 필터링
    bookmarkedWordsList = WORDS.filter(item => bookmarkedWords.has(item.word));
    
    // 알파벳별로 그룹화
    groupedWords = {};
    bookmarkedWordsList.forEach(item => {
      const firstLetter = item.word.charAt(0).toUpperCase();
      if (!groupedWords[firstLetter]) {
        groupedWords[firstLetter] = [];
      }
      groupedWords[firstLetter].push(item);
    });
    
    // 렌더링
    if (bookmarkedWordsList.length === 0) {
      showEmptyMessage();
    } else {
      renderAlphabetGrid();
      clearFilter();
      document.getElementById('controlsArea').style.display = 'flex';
    }
    
    updateCount();
  } catch (error) {
    alert('데이터를 불러오는데 실패했습니다: ' + error.message);
    console.error('Error:', error);
  }
}

// -----------------------------
// 빈 메시지 표시
// -----------------------------
function showEmptyMessage() {
  document.getElementById('emptyMessage').style.display = 'block';
  document.getElementById('alphabetGrid').style.display = 'none';
  document.getElementById('wordList').style.display = 'none';
  document.getElementById('controlsArea').style.display = 'none';
}

// -----------------------------
// 알파벳 그리드 렌더링
// -----------------------------
function renderAlphabetGrid() {
  document.getElementById('emptyMessage').style.display = 'none';
  document.getElementById('alphabetGrid').style.display = 'grid';
  document.getElementById('wordList').style.display = 'block';
  
  const sortedLetters = Object.keys(groupedWords).sort();
  let html = '';
  
  sortedLetters.forEach(letter => {
    const count = groupedWords[letter].length;
    html += `
      <div class="alphabet-btn" onclick="filterByAlphabet('${letter}')">
        <span class="alphabet-letter">${letter}</span>
        <span class="alphabet-count">${count}개</span>
      </div>
    `;
  });
  
  document.getElementById('alphabetGrid').innerHTML = html;
}

// -----------------------------
// 알파벳 필터
// -----------------------------
function filterByAlphabet(letter) {
  // 같은 알파벳을 다시 클릭하면 목록 닫기
  if (currentFilter === letter) {
    clearFilter();
    return;
  }
  
  currentFilter = letter;
  currentDisplayWords = groupedWords[letter] || [];
  
  // 알파벳 버튼 활성화 상태 변경
  document.querySelectorAll('.alphabet-btn').forEach(btn => {
    btn.classList.remove('active');
  });
  event.target.closest('.alphabet-btn').classList.add('active');
  
  // 필터 표시
  document.getElementById('currentFilter').style.display = 'block';
  document.getElementById('currentFilter').textContent = `${letter}로 시작하는 즐겨찾기 (${currentDisplayWords.length}개)`;
  
  // 목록 닫기 버튼 표시
  document.getElementById('clearBtn').style.display = 'block';
  
  renderWordList();
}

// -----------------------------
// 필터 초기화 (목록 닫기)
// -----------------------------
function clearFilter() {
  currentFilter = null;
  currentDisplayWords = [];
  
  // 알파벳 버튼 활성화 해제
  document.querySelectorAll('.alphabet-btn').forEach(btn => {
    btn.classList.remove('active');
  });
  
  // 필터 표시 숨기기
  document.getElementById('currentFilter').style.display = 'none';
  
  // 목록 닫기 버튼 숨기기
  document.getElementById('clearBtn').style.display = 'none';
  
  renderWordList();
}

// -----------------------------
// 단어 목록 렌더링
// -----------------------------
function renderWordList() {
  let html = '';
  
  if (currentDisplayWords.length === 0) {
    // 단어가 없을 때 안내 메시지
    html = '<p style="text-align: center; color: #999; padding: 40px;">알파벳을 선택하여 즐겨찾기 단어를 확인하세요</p>';
  } else {
    currentDisplayWords.forEach((word, idx) => {
      html += `
        <div class="word-item">
          <div class="word-info">
            <div class="word-name" onclick="toggleMeaning(${idx})">${word.word}</div>
            <div class="word-meaning" id="meaning-${idx}">${word.meaning.join(', ')}</div>
          </div>
          <div class="word-actions">
            <button class="speak-btn" onclick="speakWord('${word.word}')">🔊</button>
            <button class="remove-btn" onclick="removeBookmark('${word.word}')">❌</button>
          </div>
        </div>
      `;
    });
  }
  
  document.getElementById('wordList').innerHTML = html;
}

// -----------------------------
// 뜻 토글
// -----------------------------
function toggleMeaning(idx) {
  const meaningEl = document.getElementById(`meaning-${idx}`);
  if (meaningEl) {
    meaningEl.classList.toggle('show');
  }
}

// -----------------------------
// 카운트 업데이트
// -----------------------------
function updateCount() {
  document.getElementById('totalCount').textContent = 
    `즐겨찾기 단어: ${bookmarkedWordsList.length}개`;
}

// -----------------------------
// 단어 발음
// -----------------------------
function speakWord(word) {
  const utterance = new SpeechSynthesisUtterance(word);
  utterance.lang = 'en-US';
  utterance.rate = 0.8;
  
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utterance);
}

// -----------------------------
// 즐겨찾기 제거
// -----------------------------
function removeBookmark(word) {
  if (!confirm(`"${word}"를 즐겨찾기에서 제거하시겠습니까?`)) {
    return;
  }
  
  bookmarkedWords.delete(word);
  localStorage.setItem('bookmarkedWords', JSON.stringify([...bookmarkedWords]));
  
  // 다시 불러오기
  loadData();
}

// -----------------------------
// 전체 삭제
// -----------------------------
function clearAllBookmarks() {
  if (bookmarkedWordsList.length === 0) {
    alert('삭제할 즐겨찾기가 없습니다.');
    return;
  }
  
  if (!confirm(`모든 즐겨찾기(${bookmarkedWordsList.length}개)를 삭제하시겠습니까?`)) {
    return;
  }
  
  bookmarkedWords.clear();
  localStorage.setItem('bookmarkedWords', JSON.stringify([]));
  
  // 다시 불러오기
  loadData();
}

// 페이지 로드 시 데이터 불러오기
loadData();
</script>
</body>
</html>
