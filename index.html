<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나만의 영어단어 퀴즈</title>
  <meta name="theme-color" content="#ffffff">

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f7f7f7;
      margin: 0;
    }
    .main-wrapper {
      display: flex;
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
      padding-left: 200px;
      padding-right: 50px;
    }
    .container {
      flex: 1;
      max-width: 600px;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .wrong-words-panel {
      width: 350px;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      position: sticky;
      top: 20px;
    }
    .wrong-words-panel h3 {
      margin-top: 0;
      color: #dc3545;
      border-bottom: 2px solid #dc3545;
      padding-bottom: 10px;
    }
    .wrong-word-item {
      background: #fff5f5;
      border: 1px solid #ffcccc;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .wrong-word-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      gap: 10px;
    }
    .wrong-word-english {
      font-weight: bold;
      font-size: 18px;
      color: #333;
      flex: 1;
      min-width: 0;
    }
    .wrong-word-korean {
      color: #666;
      font-size: 14px;
      margin-bottom: 5px;
    }
    .wrong-word-user-answer {
      color: #dc3545;
      font-size: 13px;
      font-style: italic;
    }
    .wrong-bookmark-btn {
      background: #ffc107;
      color: white;
      border: none;
      padding: 3px 6px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 11px;
      width: 45px;
      flex-shrink: 0;
      white-space: nowrap;
    }
    .wrong-bookmark-btn:hover {
      background: #e0a800;
    }
    .wrong-bookmark-btn.active {
      background: #ff9800;
    }
    .empty-message {
      text-align: center;
      color: #999;
      padding: 40px 20px;
      font-size: 14px;
    }
    input, button, select {
      font-size: 18px;
      padding: 10px;
      width: 100%;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #aaa;
      box-sizing: border-box;
    }
    button {
      background: #4a8fff;
      color: white;
      font-weight: bold;
      cursor: pointer;
      border: none;
    }
    button:hover {
      background: #3a7fee;
    }
    .question {
      font-size: 22px;
      margin: 20px 0;
      font-weight: bold;
    }
    .result {
      margin-top: 20px;
      font-size: 18px;
      white-space: pre-line;
    }
    .nav-menu {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .nav-btn {
      flex: 1;
      min-width: 120px;
      padding: 12px;
      background: #e8f4f8;
      color: #333;
      border: 2px solid #4a8fff;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      text-decoration: none;
      text-align: center;
      transition: all 0.3s;
      display: block;
    }
    .nav-btn:hover {
      background: #4a8fff;
      color: white;
    }
    .nav-btn.active {
      background: #4a8fff;
      color: white;
    }
    .mode-selector {
      display: flex;
      gap: 10px;
      margin: 20px 0;
    }
    .mode-btn {
      flex: 1;
      padding: 15px;
      background: #e0e0e0;
      color: #333;
      border: 2px solid #ccc;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      transition: all 0.3s;
    }
    .mode-btn:hover {
      background: #d0d0d0;
    }
    .mode-btn.active {
      background: #4a8fff;
      color: white;
      border-color: #4a8fff;
    }
    .test-table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
    }
    .test-table th {
      background: #4a8fff;
      color: white;
      padding: 10px;
      text-align: left;
      font-size: 16px;
    }
    .test-table td {
      padding: 8px;
      border-bottom: 1px solid #ddd;
      vertical-align: middle;
    }
    .test-bookmark-btn {
      background: #ffc107;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      margin-left: 5px;
    }
    .test-bookmark-btn:hover {
      background: #e0a800;
    }
    .test-bookmark-btn.active {
      background: #ff9800;
    }
    .test-table input {
      width: 100%;
      padding: 5px;
      margin: 0;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .test-table input.correct {
      background: #d4edda;
      border-color: #28a745;
    }
    .test-table input.wrong {
      background: #f8d7da;
      border-color: #dc3545;
    }
    .score-display {
      font-size: 24px;
      font-weight: bold;
      color: #4a8fff;
      text-align: center;
      margin: 20px 0;
      padding: 20px;
      background: #f0f8ff;
      border-radius: 8px;
    }
    .answer-key {
      margin-top: 10px;
      font-size: 14px;
      color: #666;
    }
    .progress {
      margin: 10px 0;
      font-size: 16px;
      color: #666;
      font-weight: bold;
    }
    
    @media (max-width: 1024px) {
      .main-wrapper {
        flex-direction: column;
        padding-left: 20px;
      }
      .wrong-words-panel {
        width: 100%;
        max-height: none;
        position: relative;
        top: 0;
      }
      .container {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>

<div class="main-wrapper">
  <div class="container">
    <h2>📘 나만의 영어단어 퀴즈</h2>

    <!-- 네비게이션 메뉴 -->
    <div class="nav-menu">
      <a href="wordlist.html" class="nav-btn">📚 전체 단어</a>
      <a href="bookmarks.html" class="nav-btn">⭐ 즐겨찾기</a>
      <a href="index.html" class="nav-btn active">🎯 퀴즈</a>
    </div>

    <!-- 모드 선택 버튼 -->
    <div class="mode-selector">
      <button class="mode-btn active" onclick="selectMode('quiz')" id="quizModeBtn">
        🎯 퀴즈 모드
      </button>
      <button class="mode-btn" onclick="selectMode('test')" id="testModeBtn">
        📝 시험지 모드
      </button>
    </div>

    <!-- 퀴즈 모드 설정 -->
    <div id="quizSettings">
      <label>문제 유형 선택:</label>
      <select id="quizMode">
        <option value="mixed">혼합 (영어+한글)</option>
        <option value="korean">한글 뜻만 맞추기 (영어→한글)</option>
        <option value="english">영어 단어만 맞추기 (한글→영어)</option>
      </select>

      <label>단어 선택 방식:</label>
      <select id="quizSelectMode" onchange="changeQuizSelectMode()">
        <option value="range">범위로 선택</option>
        <option value="alphabet">알파벳으로 선택</option>
      </select>

      <!-- 범위 선택 -->
      <div id="quizRangeSelect">
        <label>단어 범위 선택:</label>
        <div style="display: flex; gap: 10px; align-items: center; margin-top: 10px;">
          <input type="number" id="rangeStart" placeholder="시작" min="1" style="width: 80px;" value="1" />
          <span>~</span>
          <input type="number" id="rangeEnd" placeholder="끝" min="1" style="width: 80px;" />
          <button onclick="setFullRange()" style="width: auto; padding: 10px 15px; margin: 0;">전체</button>
        </div>

        <label>문제 개수 선택 (최대 50):</label>
        <select id="quizCount">
          <option value="10">10개</option>
          <option value="20">20개</option>
          <option value="30">30개</option>
          <option value="40">40개</option>
          <option value="50">50개</option>
        </select>
      </div>

      <!-- 알파벳 선택 -->
      <div id="quizAlphabetSelect" style="display:none;">
        <label>시작 알파벳 선택:</label>
        <select id="alphabetFilter" style="margin-top: 10px;">
          <option value="">선택하세요</option>
          <option value="a">A</option>
          <option value="b">B</option>
          <option value="c">C</option>
          <option value="d">D</option>
          <option value="e">E</option>
          <option value="f">F</option>
          <option value="g">G</option>
          <option value="h">H</option>
          <option value="i">I</option>
          <option value="j">J</option>
          <option value="k">K</option>
          <option value="l">L</option>
          <option value="m">M</option>
          <option value="n">N</option>
          <option value="o">O</option>
          <option value="p">P</option>
          <option value="q">Q</option>
          <option value="r">R</option>
          <option value="s">S</option>
          <option value="t">T</option>
          <option value="u">U</option>
          <option value="v">V</option>
          <option value="w">W</option>
          <option value="x">X</option>
          <option value="y">Y</option>
          <option value="z">Z</option>
        </select>
        <div id="alphabetCount" style="margin-top: 10px; color: #666; font-size: 14px;"></div>
      </div>

      <button onclick="startQuiz()">퀴즈 시작</button>
    </div>

    <!-- 시험지 모드 설정 -->
    <div id="testSettings" style="display:none;">
      <label>시험지 유형 선택:</label>
      <select id="testMode">
        <option value="mixed">혼합 (영어+한글)</option>
        <option value="korean">한글 뜻만 맞추기 (영어→한글)</option>
        <option value="english">영어 단어만 맞추기 (한글→영어)</option>
      </select>

      <label>단어 선택 방식:</label>
      <select id="testSelectMode" onchange="changeTestSelectMode()">
        <option value="range">범위로 선택</option>
        <option value="alphabet">알파벳으로 선택</option>
      </select>

      <!-- 범위 선택 -->
      <div id="testRangeSelect">
        <label>단어 범위 선택:</label>
        <div style="display: flex; gap: 10px; align-items: center; margin-top: 10px;">
          <input type="number" id="testRangeStart" placeholder="시작" min="1" style="width: 80px;" value="1" />
          <span>~</span>
          <input type="number" id="testRangeEnd" placeholder="끝" min="1" style="width: 80px;" />
          <button onclick="setFullRangeTest()" style="width: auto; padding: 10px 15px; margin: 0;">전체</button>
        </div>

        <label>문제 개수 선택:</label>
        <select id="testCount">
          <option value="20">20개</option>
          <option value="30">30개</option>
          <option value="40">40개</option>
          <option value="50">50개</option>
        </select>
      </div>

      <!-- 알파벳 선택 -->
      <div id="testAlphabetSelect" style="display:none;">
        <label>시작 알파벳 선택:</label>
        <select id="testAlphabetFilter" onchange="updateTestAlphabetCount()" style="margin-top: 10px;">
          <option value="">선택하세요</option>
          <option value="a">A</option>
          <option value="b">B</option>
          <option value="c">C</option>
          <option value="d">D</option>
          <option value="e">E</option>
          <option value="f">F</option>
          <option value="g">G</option>
          <option value="h">H</option>
          <option value="i">I</option>
          <option value="j">J</option>
          <option value="k">K</option>
          <option value="l">L</option>
          <option value="m">M</option>
          <option value="n">N</option>
          <option value="o">O</option>
          <option value="p">P</option>
          <option value="q">Q</option>
          <option value="r">R</option>
          <option value="s">S</option>
          <option value="t">T</option>
          <option value="u">U</option>
          <option value="v">V</option>
          <option value="w">W</option>
          <option value="x">X</option>
          <option value="y">Y</option>
          <option value="z">Z</option>
        </select>
        <div id="testAlphabetCount" style="margin-top: 10px; color: #666; font-size: 14px;"></div>
      </div>

      <button onclick="startTest()">시험지 생성</button>
    </div>

    <!-- 퀴즈 영역 -->
    <div id="quizArea" style="display:none;">
      <div class="progress" id="progress"></div>
      <div class="question" id="question"></div>
      <button onclick="speakWord()" id="speakBtn" style="background: #28a745; margin-bottom: 10px;">
        🔊 발음 듣기
      </button>
      <input id="answerInput" placeholder="정답 입력..." onkeypress="handleKeyPress(event)" />
      <button onclick="checkAnswer()">제출</button>
      <div class="result" id="result"></div>
      <button onclick="nextQuestion()" id="nextBtn" style="display:none;">다음 문제</button>
    </div>

    <!-- 시험지 영역 -->
    <div id="testArea" style="display:none;">
      <h3>📝 영어 단어 시험지</h3>
      <div id="testTableContainer"></div>
      <button onclick="submitTest()" id="submitTestBtn" style="margin-top: 20px;">채점하기</button>
      <div id="scoreArea" style="display:none;">
        <div class="score-display" id="scoreDisplay"></div>
        <button onclick="resetTest()">다시 풀기</button>
        <button onclick="selectMode('test')">새 시험지</button>
      </div>
    </div>
  </div>

  <!-- 틀린 단어 패널 -->
  <div class="wrong-words-panel" id="wrongWordsPanel">
    <h3>❌ 틀린 단어</h3>
    <div id="wrongWordsList">
      <div class="empty-message">
        퀴즈를 시작하면<br>틀린 단어가 여기에 표시됩니다
      </div>
    </div>
  </div>
</div>

<script>
// -----------------------------
// 영단어 목록 (words.json에서 불러옴)
// -----------------------------
let WORDS = [];
let isLoading = true;

// JSON 파일에서 단어 불러오기
fetch('words.json')
  .then(response => {
    if (!response.ok) {
      throw new Error('words.json 파일을 찾을 수 없습니다.');
    }
    return response.json();
  })
  .then(data => {
    WORDS = data;
    isLoading = false;
    console.log(`${WORDS.length}개의 단어를 불러왔습니다.`);
  })
  .catch(error => {
    isLoading = false;
    alert('단어 파일을 불러오는데 실패했습니다: ' + error.message);
    console.error('Error loading words:', error);
  });

let quizList = [];
let currentQuiz = null;
let currentIndex = 0;
let totalCount = 0;
let testList = [];
let currentMode = 'quiz';
let bookmarkedWords = new Set();
let quizCorrectCount = 0;
let quizWrongCount = 0;
let isAnswerChecked = false;
let wrongWords = [];

// -----------------------------
// 즐겨찾기 관리
// -----------------------------
function loadBookmarks() {
  const saved = localStorage.getItem('bookmarkedWords');
  if (saved) {
    bookmarkedWords = new Set(JSON.parse(saved));
  }
}

function saveBookmarks() {
  localStorage.setItem('bookmarkedWords', JSON.stringify([...bookmarkedWords]));
}

function toggleWrongWordBookmark(word, index) {
  if (bookmarkedWords.has(word)) {
    bookmarkedWords.delete(word);
  } else {
    bookmarkedWords.add(word);
  }
  
  saveBookmarks();
  updateWrongWordsList();
}

// 페이지 로드 시 즐겨찾기 불러오기
loadBookmarks();

// -----------------------------
// 틀린 단어 목록 업데이트
// -----------------------------
function updateWrongWordsList() {
  const listEl = document.getElementById('wrongWordsList');
  
  if (wrongWords.length === 0) {
    listEl.innerHTML = '<div class="empty-message">퀴즈를 시작하면<br>틀린 단어가 여기에 표시됩니다</div>';
    return;
  }
  
  let html = '';
  wrongWords.forEach((item, index) => {
    const isBookmarked = bookmarkedWords.has(item.word);
    const bookmarkClass = isBookmarked ? 'active' : '';
    const bookmarkText = isBookmarked ? '⭐ 제거' : '☆ 추가';
    
    html += `
      <div class="wrong-word-item">
        <div class="wrong-word-header">
          <div class="wrong-word-english">${item.word}</div>
          <button class="wrong-bookmark-btn ${bookmarkClass}" 
                  onclick="toggleWrongWordBookmark('${item.word}', ${index})">
            ${bookmarkText}
          </button>
        </div>
        <div class="wrong-word-korean">정답: ${item.correctAnswer}</div>
        <div class="wrong-word-korean">전체 뜻: ${item.fullMeaning}</div>
        <div class="wrong-word-user-answer">입력: ${item.userAnswer || '(무응답)'}</div>
      </div>
    `;
  });
  
  listEl.innerHTML = html;
}

// -----------------------------
// 선택 모드 변경
// -----------------------------
function changeQuizSelectMode() {
  const mode = document.getElementById('quizSelectMode').value;
  if (mode === 'range') {
    document.getElementById('quizRangeSelect').style.display = 'block';
    document.getElementById('quizAlphabetSelect').style.display = 'none';
  } else {
    document.getElementById('quizRangeSelect').style.display = 'none';
    document.getElementById('quizAlphabetSelect').style.display = 'block';
    updateAlphabetCount();
  }
}

function changeTestSelectMode() {
  const mode = document.getElementById('testSelectMode').value;
  if (mode === 'range') {
    document.getElementById('testRangeSelect').style.display = 'block';
    document.getElementById('testAlphabetSelect').style.display = 'none';
  } else {
    document.getElementById('testRangeSelect').style.display = 'none';
    document.getElementById('testAlphabetSelect').style.display = 'block';
    updateTestAlphabetCount();
  }
}

function updateAlphabetCount() {
  const letter = document.getElementById('alphabetFilter').value;
  if (!letter) {
    document.getElementById('alphabetCount').textContent = '';
    return;
  }
  const count = WORDS.filter(w => w.word.toLowerCase().startsWith(letter)).length;
  document.getElementById('alphabetCount').textContent = `${letter.toUpperCase()}로 시작하는 단어: ${count}개`;
}

function updateTestAlphabetCount() {
  const letter = document.getElementById('testAlphabetFilter').value;
  if (!letter) {
    document.getElementById('testAlphabetCount').textContent = '';
    return;
  }
  const count = WORDS.filter(w => w.word.toLowerCase().startsWith(letter)).length;
  document.getElementById('testAlphabetCount').textContent = `${letter.toUpperCase()}로 시작하는 단어: ${count}개 (전체 출제)`;
}

// 알파벳 필터 변경 시 자동 업데이트
document.addEventListener('DOMContentLoaded', () => {
  const alphabetFilter = document.getElementById('alphabetFilter');
  if (alphabetFilter) {
    alphabetFilter.addEventListener('change', updateAlphabetCount);
  }
});

// -----------------------------
// 전체 범위 설정
// -----------------------------
function setFullRange() {
  if (WORDS.length > 0) {
    document.getElementById('rangeEnd').value = WORDS.length;
  }
}

function setFullRangeTest() {
  if (WORDS.length > 0) {
    document.getElementById('testRangeEnd').value = WORDS.length;
  }
}

// 데이터 로드 후 끝 번호 자동 설정
window.addEventListener('load', () => {
  // 1초 후 재시도 (데이터 로딩 대기)
  setTimeout(() => {
    if (WORDS.length > 0) {
      document.getElementById('rangeEnd').value = WORDS.length;
      document.getElementById('testRangeEnd').value = WORDS.length;
    }
  }, 1000);
});

// -----------------------------
// 모드 선택
// -----------------------------
function selectMode(mode) {
  currentMode = mode;
  
  // 버튼 스타일 변경
  document.getElementById('quizModeBtn').classList.remove('active');
  document.getElementById('testModeBtn').classList.remove('active');
  
  if (mode === 'quiz') {
    document.getElementById('quizModeBtn').classList.add('active');
    document.getElementById('quizSettings').style.display = 'block';
    document.getElementById('testSettings').style.display = 'none';
    document.getElementById('quizArea').style.display = 'none';
    document.getElementById('testArea').style.display = 'none';
    
    // 틀린 단어 패널 초기화
    wrongWords = [];
    updateWrongWordsList();
  } else {
    document.getElementById('testModeBtn').classList.add('active');
    document.getElementById('quizSettings').style.display = 'none';
    document.getElementById('testSettings').style.display = 'block';
    document.getElementById('quizArea').style.display = 'none';
    document.getElementById('testArea').style.display = 'none';
  }
}

// -----------------------------
// 퀴즈 시작
// -----------------------------
function startQuiz() {
  // 로딩 체크
  if (isLoading) {
    alert('단어를 불러오는 중입니다. 잠시만 기다려주세요.');
    return;
  }

  const mode = document.getElementById("quizMode").value;
  const selectMode = document.getElementById("quizSelectMode").value;
  
  let selectedWords = [];
  
  if (selectMode === 'range') {
    // 범위 선택 모드
    const count = Number(document.getElementById("quizCount").value);
    const rangeStart = Number(document.getElementById("rangeStart").value);
    const rangeEnd = Number(document.getElementById("rangeEnd").value);
    
    // 범위 유효성 검사
    if (!rangeStart || !rangeEnd) {
      alert('단어 범위를 입력해주세요.');
      return;
    }
    
    if (rangeStart < 1 || rangeEnd > WORDS.length) {
      alert(`단어 범위는 1~${WORDS.length} 사이여야 합니다.`);
      return;
    }
    
    if (rangeStart > rangeEnd) {
      alert('시작 번호가 끝 번호보다 클 수 없습니다.');
      return;
    }

    // 범위 내 단어 필터링
    const rangeWords = WORDS.slice(rangeStart - 1, rangeEnd);
    
    // 단어 수 체크
    if (rangeWords.length < count) {
      alert(`선택한 범위에 ${rangeWords.length}개의 단어만 있습니다. 문제 개수를 줄여주세요.`);
      return;
    }
    
    selectedWords = [...rangeWords].sort(() => Math.random() - 0.5).slice(0, count);
    totalCount = count;
    
  } else {
    // 알파벳 선택 모드
    const letter = document.getElementById('alphabetFilter').value;
    
    if (!letter) {
      alert('알파벳을 선택해주세요.');
      return;
    }
    
    // 해당 알파벳으로 시작하는 단어 필터링
    selectedWords = WORDS.filter(w => w.word.toLowerCase().startsWith(letter));
    
    if (selectedWords.length === 0) {
      alert(`${letter.toUpperCase()}로 시작하는 단어가 없습니다.`);
      return;
    }
    
    // 섞기
    selectedWords = [...selectedWords].sort(() => Math.random() - 0.5);
    totalCount = selectedWords.length;
  }

  // 리스트 생성
  quizList = selectedWords.map(item => {
    let isWordMode;
    
    // 문제 유형에 따라 설정
    if (mode === "korean") {
      isWordMode = true;
    } else if (mode === "english") {
      isWordMode = false;
    } else {
      isWordMode = Math.random() < 0.5;
    }
    
    return {
      question: isWordMode ? item.word : item.meaning.join(", "),
      answerList: isWordMode ? item.meaning : [item.word],
      fullMeaning: item.meaning,
      originalWord: item.word,
      isWordMode: isWordMode
    };
  });

  currentIndex = 0;
  quizCorrectCount = 0;
  quizWrongCount = 0;
  wrongWords = [];
  document.getElementById("quizArea").style.display = "block";
  document.getElementById("result").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
  updateWrongWordsList();
  showQuestion();
}

// -----------------------------
// 문제 출력
// -----------------------------
function showQuestion() {
  currentQuiz = quizList[currentIndex];
  isAnswerChecked = false;
  document.getElementById("progress").textContent = 
    `진행: ${currentIndex + 1} / ${totalCount} | 정답: ${quizCorrectCount}개 | 오답: ${quizWrongCount}개`;
  document.getElementById("question").textContent =
    `문제 ${currentIndex + 1}: ${currentQuiz.question}`;
  document.getElementById("answerInput").value = "";
  document.getElementById("result").innerHTML = "";
  document.getElementById("nextBtn").style.display = "none";
  document.getElementById("answerInput").focus();
}

// -----------------------------
// 답안 체크
// -----------------------------
function checkAnswer() {
  // 이미 체크한 경우 무시
  if (isAnswerChecked) {
    return;
  }

  const user = document.getElementById("answerInput").value.trim();
  if (!user) {
    alert("답을 입력해주세요!");
    return;
  }

  const result = document.getElementById("result");

  // 정답 조건: 항상 완전일치 (대소문자 구분 안 함)
  const isCorrect = currentQuiz.answerList.some(ans =>
    ans.toLowerCase() === user.toLowerCase()
  );

  // 맞춘 정답
  const matchedMeaning = currentQuiz.answerList.filter(ans =>
    ans.toLowerCase() === user.toLowerCase()
  );

  // 전체 뜻 중 나머지
  const otherMeanings = currentQuiz.fullMeaning.filter(
    m => !matchedMeaning.some(matched => matched.toLowerCase() === m.toLowerCase())
  );

  if (isCorrect) {
    quizCorrectCount++;
    result.innerHTML =
      `⭕ <b>정답입니다!</b><br>
      입력한 답: ${user}<br>
      맞는 정답: ${matchedMeaning.join(", ")}<br>
      ${otherMeanings.length > 0 ? `다른 뜻들: ${otherMeanings.join(", ")}` : ''}`;
  } else {
    quizWrongCount++;
    result.innerHTML =
      `❌ <b>오답입니다.</b><br>
      입력한 답: ${user}<br>
      정답: ${currentQuiz.answerList.join(", ")}<br>
      전체 뜻: ${currentQuiz.fullMeaning.join(", ")}`;
    
    // 틀린 단어 목록에 추가
    wrongWords.push({
      word: currentQuiz.originalWord,
      correctAnswer: currentQuiz.answerList.join(", "),
      userAnswer: user,
      fullMeaning: currentQuiz.fullMeaning.join(", ")
    });
    updateWrongWordsList();
  }

  // 답변 체크 완료 표시
  isAnswerChecked = true;

  // 진행률 업데이트 (정답/오답 수 반영)
  document.getElementById("progress").textContent = 
    `진행: ${currentIndex + 1} / ${totalCount} | 정답: ${quizCorrectCount}개 | 오답: ${quizWrongCount}개`;

  // 다음 버튼 표시
  document.getElementById("nextBtn").style.display = "block";
}

// -----------------------------
// 다음 문제
// -----------------------------
function nextQuestion() {
  currentIndex++;
  if (currentIndex >= quizList.length) {
    const totalScore = Math.round((quizCorrectCount / totalCount) * 100);
    alert(`퀴즈 완료!\n\n총 ${totalCount}문제 중\n정답: ${quizCorrectCount}개\n오답: ${quizWrongCount}개\n\n점수: ${totalScore}점\n\n수고하셨습니다!`);
    document.getElementById("quizArea").style.display = "none";
    return;
  }
  showQuestion();
}

// -----------------------------
// 음성 발음 (영어 단어만)
// -----------------------------
function speakWord() {
  if (!currentQuiz) return;
  
  const textToSpeak = currentQuiz.originalWord;
  
  // 음성 합성
  const utterance = new SpeechSynthesisUtterance(textToSpeak);
  utterance.lang = 'en-US';
  utterance.rate = 0.8;
  
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utterance);
}

// -----------------------------
// 시험지 모드 시작
// -----------------------------
function startTest() {
  if (isLoading) {
    alert('단어를 불러오는 중입니다. 잠시만 기다려주세요.');
    return;
  }

  const mode = document.getElementById("testMode").value;
  const selectMode = document.getElementById("testSelectMode").value;
  
  let selectedWords = [];
  
  if (selectMode === 'range') {
    // 범위 선택 모드
    const count = Number(document.getElementById("testCount").value);
    const rangeStart = Number(document.getElementById("testRangeStart").value);
    const rangeEnd = Number(document.getElementById("testRangeEnd").value);
    
    // 범위 유효성 검사
    if (!rangeStart || !rangeEnd) {
      alert('단어 범위를 입력해주세요.');
      return;
    }
    
    if (rangeStart < 1 || rangeEnd > WORDS.length) {
      alert(`단어 범위는 1~${WORDS.length} 사이여야 합니다.`);
      return;
    }
    
    if (rangeStart > rangeEnd) {
      alert('시작 번호가 끝 번호보다 클 수 없습니다.');
      return;
    }

    // 범위 내 단어 필터링
    const rangeWords = WORDS.slice(rangeStart - 1, rangeEnd);
    
    // 단어 수 체크
    if (rangeWords.length < count) {
      alert(`선택한 범위에 ${rangeWords.length}개의 단어만 있습니다. 문제 개수를 줄여주세요.`);
      return;
    }
    
    selectedWords = [...rangeWords].sort(() => Math.random() - 0.5).slice(0, count);
    
  } else {
    // 알파벳 선택 모드
    const letter = document.getElementById('testAlphabetFilter').value;
    
    if (!letter) {
      alert('알파벳을 선택해주세요.');
      return;
    }
    
    // 해당 알파벳으로 시작하는 단어 필터링
    selectedWords = WORDS.filter(w => w.word.toLowerCase().startsWith(letter));
    
    if (selectedWords.length === 0) {
      alert(`${letter.toUpperCase()}로 시작하는 단어가 없습니다.`);
      return;
    }
    
    // 섞기
    selectedWords = [...selectedWords].sort(() => Math.random() - 0.5);
  }

  // 시험지 리스트 생성
  testList = selectedWords.map((item, index) => {
    let isWordMode;
    
    if (mode === "korean") {
      isWordMode = true;
    } else if (mode === "english") {
      isWordMode = false;
    } else {
      isWordMode = Math.random() < 0.5;
    }
    
    return {
      id: index,
      question: isWordMode ? item.word : item.meaning.join(", "),
      correctAnswer: isWordMode ? item.meaning : [item.word],
      fullMeaning: item.meaning,
      originalWord: item.word,
      isWordMode: isWordMode,
      userAnswer: ""
    };
  });

  createTestTable();
  
  document.getElementById('testArea').style.display = 'block';
  document.getElementById('scoreArea').style.display = 'none';
  document.getElementById('submitTestBtn').style.display = 'block';
}

// -----------------------------
// 시험지 테이블 생성
// -----------------------------
function createTestTable() {
  let html = '<table class="test-table">';
  html += '<thead><tr><th style="width:50px;">번호</th><th>문제</th><th>답안</th><th style="width:80px;">즐겨찾기</th></tr></thead>';
  html += '<tbody>';
  
  testList.forEach((item, index) => {
    const isBookmarked = bookmarkedWords.has(item.originalWord);
    const bookmarkClass = isBookmarked ? 'active' : '';
    const bookmarkText = isBookmarked ? '⭐' : '☆';
    
    html += `
      <tr>
        <td>${index + 1}</td>
        <td>${item.question}</td>
        <td>
          <input type="text" 
                 id="answer_${item.id}" 
                 placeholder="답 입력"
                 autocomplete="off" />
        </td>
        <td style="text-align: center;">
          <button class="test-bookmark-btn ${bookmarkClass}" 
                  onclick="toggleTestBookmark('${item.originalWord}', ${item.id})"
                  id="bookmark_${item.id}">
            ${bookmarkText}
          </button>
        </td>
      </tr>
    `;
  });
  
  html += '</tbody></table>';
  document.getElementById('testTableContainer').innerHTML = html;
}

// -----------------------------
// 시험지에서 즐겨찾기 토글
// -----------------------------
function toggleTestBookmark(word, itemId) {
  if (bookmarkedWords.has(word)) {
    bookmarkedWords.delete(word);
  } else {
    bookmarkedWords.add(word);
  }
  
  saveBookmarks();
  
  // 버튼 업데이트
  const btn = document.getElementById(`bookmark_${itemId}`);
  if (bookmarkedWords.has(word)) {
    btn.classList.add('active');
    btn.textContent = '⭐';
  } else {
    btn.classList.remove('active');
    btn.textContent = '☆';
  }
}

// -----------------------------
// 시험지 채점
// -----------------------------
function submitTest() {
  let correctCount = 0;
  
  testList.forEach(item => {
    const inputEl = document.getElementById(`answer_${item.id}`);
    const userAnswer = inputEl.value.trim();
    item.userAnswer = userAnswer;
    
    // 정답 체크: 항상 완전일치 (대소문자 구분 안 함)
    const isCorrect = item.correctAnswer.some(ans =>
      ans.toLowerCase() === userAnswer.toLowerCase()
    );
    
    // 스타일 적용
    if (userAnswer === "") {
      inputEl.classList.remove('correct', 'wrong');
    } else if (isCorrect) {
      inputEl.classList.add('correct');
      inputEl.classList.remove('wrong');
      correctCount++;
    } else {
      inputEl.classList.add('wrong');
      inputEl.classList.remove('correct');
    }
    
    // 정답 표시
    if (!isCorrect && userAnswer !== "") {
      const correctText = item.correctAnswer.join(", ");
      if (!inputEl.nextElementSibling || !inputEl.nextElementSibling.classList.contains('answer-key')) {
        const answerKey = document.createElement('div');
        answerKey.className = 'answer-key';
        answerKey.textContent = `정답: ${correctText}`;
        inputEl.parentElement.appendChild(answerKey);
      }
    }
  });
  
  const score = Math.round((correctCount / testList.length) * 100);
  document.getElementById('scoreDisplay').innerHTML = `
    <div>총 ${testList.length}문제 중 ${correctCount}개 정답</div>
    <div style="font-size: 36px; margin-top: 10px;">${score}점</div>
  `;
  
  document.getElementById('scoreArea').style.display = 'block';
  document.getElementById('submitTestBtn').style.display = 'none';
  
  document.getElementById('scoreDisplay').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// -----------------------------
// 시험지 초기화
// -----------------------------
function resetTest() {
  testList.forEach(item => {
    const inputEl = document.getElementById(`answer_${item.id}`);
    if (inputEl) {
      inputEl.value = "";
      inputEl.classList.remove('correct', 'wrong');
      
      const answerKey = inputEl.parentElement.querySelector('.answer-key');
      if (answerKey) {
        answerKey.remove();
      }
    }
  });
  
  document.getElementById('scoreArea').style.display = 'none';
  document.getElementById('submitTestBtn').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// -----------------------------
// 엔터키로 제출
// -----------------------------
function handleKeyPress(event) {
  if (event.key === "Enter") {
    const nextBtn = document.getElementById("nextBtn");
    if (nextBtn.style.display === "none") {
      checkAnswer();
    } else {
      nextQuestion();
    }
  }
}
</script>
